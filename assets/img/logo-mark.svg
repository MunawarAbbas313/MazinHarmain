<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Mazin Haramain Tours &amp; Travels">
  <title>Mazin Haramain Tours &amp; Travels</title>
  <!--
    The brand mark, redrawn September 2026.

    The original raster logo set the M and H inside a mihrab arch topped with
    a crescent, with the Kaaba and the Green Dome filling the arch and the
    aeroplane clipped by its edge. The client asked for the religious
    elements to come out, the globe to be drawn properly and the aeroplane to
    be whole. Everything here is vector, so it stays sharp at favicon size
    and at signage size — which the 1254px JPEG never did.

    Geometry is deliberate rather than eyeballed:
      M spans x 18-46, H spans x 74-102, and the globe sits at cx 60 r 11,
      so it occupies 49-71 and clears both letterforms instead of covering
      their inner strokes.
      The globe's equator, the M's valley and the H's crossbar all sit on
      y 69, so the three letters read along one line.
      The flight arc passes above the letters and ends under the aeroplane's
      nose, so the arc and the plane are one gesture.

    The aeroplane is the same silhouette as the `plane` entry in
    src/lib/icons.js, filled rather than stroked. Reusing a shape already
    proven on the site beat hand-rolling a new one.
  -->
  <defs>
    <linearGradient id="mh-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7cb8a"/>
      <stop offset="0.45" stop-color="#c79a3e"/>
      <stop offset="1" stop-color="#9a7727"/>
    </linearGradient>
    <linearGradient id="mh-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f5f44"/>
      <stop offset="1" stop-color="#05301f"/>
    </linearGradient>
    <clipPath id="mh-globe-clip">
      <circle cx="60" cy="69" r="11"/>
    </clipPath>
  </defs>

  <!-- Badge -->
  <rect width="120" height="120" rx="26" fill="url(#mh-green)"/>
  <rect x="3.5" y="3.5" width="113" height="113" rx="23" fill="none"
        stroke="url(#mh-gold)" stroke-width="1.5" opacity="0.6"/>

  <!-- Flight arc, above the letterforms, running into the aeroplane's nose -->
  <path d="M17 50C30 30 52 21 74 21" fill="none" stroke="url(#mh-gold)"
        stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Aeroplane, complete and unclipped -->
  <g transform="translate(74 6) scale(1.65)">
    <path fill="url(#mh-gold)"
          d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.4-.2c.4-.3.6-.7.6-1.2z"/>
  </g>

  <!-- M -->
  <path d="M18 86V52l14 17 14-17v34" fill="none" stroke="url(#mh-gold)"
        stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- H -->
  <path d="M74 52v34M74 69h28M102 52v34" fill="none" stroke="url(#mh-gold)"
        stroke-width="8" stroke-linecap="round"/>

  <!-- Globe, clear of both letters, equator on the same line as the crossbar -->
  <circle cx="60" cy="69" r="11" fill="#05301f"/>
  <g clip-path="url(#mh-globe-clip)" fill="none" stroke="url(#mh-gold)"
     stroke-width="1.35" stroke-linecap="round" opacity="0.95">
    <path d="M49 63.5h22M49 69h22M49 74.5h22"/>
    <ellipse cx="60" cy="69" rx="4.7" ry="11"/>
    <path d="M60 58v22"/>
  </g>
  <circle cx="60" cy="69" r="11" fill="none" stroke="url(#mh-gold)" stroke-width="2.3"/>
</svg>
